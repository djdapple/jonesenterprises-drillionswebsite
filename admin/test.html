<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drillions Authentication Test</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:40px auto;padding:20px;max-width:620px}input,button{box-sizing:border-box;padding:12px;margin:8px 0;width:100%;font:inherit}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222;padding:16px}label{display:block}</style></head><body>
<h1>Drillions / Authentication Test</h1><p>Independent test — no product changes.</p>
<form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Test email login</button></form>
<button id="google">Test Google login</button><button id="check">Check current session</button><button id="logout">Sign out of test</button><pre id="status" role="status" aria-live="polite">Loading authentication library…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('status').textContent='FAIL: Supabase library could not load.'"></script>
<script>
const $=id=>document.getElementById(id);
const log=s=>{$('status').textContent+='\n'+s;};
const fail=e=>log('FAIL: '+(e.code?e.code+' — ':'')+(e.message||String(e)));
const base='https://pjipcgpyvsiicyyouxpt.supabase.co';
const key='sb_publishable_o5NFZ6L-_fkpCjZ4wMkY1w_U51NEfaA';
const redirect='https://djdapple.github.io/jonesenterprises-drillionswebsite/admin/test.html';
let db;
async function inspect(){const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session){log('SESSION: None');return;}log('SESSION: Present');const u=await db.auth.getUser();if(u.error)throw u.error;log('IDENTITY: Verified');const r=await db.from('admins').select('user_id').eq('user_id',u.data.user.id).maybeSingle();if(r.error)throw r.error;log(r.data?'ADMIN: Authorized — authentication test passed.':'ADMIN: Not authorized');}
async function run(fn){if(!db){log('FAIL: Client not initialized');return;}const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);const timer=setTimeout(()=>log('Still waiting after 15 seconds. Check network connectivity.'),15000);try{await fn();}catch(e){fail(e);}finally{clearTimeout(timer);buttons.forEach(b=>b.disabled=false);}}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{log('EMAIL: Sending login request…');const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(r.error)throw r.error;log('EMAIL: Accepted');await inspect();});};
$('google').onclick=()=>run(async()=>{log('GOOGLE: Starting OAuth…');const r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirect}});if(r.error)throw r.error;});
$('check').onclick=()=>run(inspect);
$('logout').onclick=()=>run(async()=>{const r=await db.auth.signOut({scope:'local'});if(r.error)throw r.error;log('Signed out of test.');});
try{if(!window.supabase)throw Error('Supabase library unavailable');db=window.supabase.createClient(base,key,{auth:{flowType:'pkce',detectSessionInUrl:false,persistSession:true,storageKey:'drillions-auth-test'}});$('status').textContent='LIBRARY: Loaded\nCLIENT: Initialized (not yet authenticated)';run(async()=>{const p=new URLSearchParams(location.search);const h=new URLSearchParams(location.hash.slice(1));if(p.has('error')||h.has('error')){log('OAUTH: '+(p.get('error_description')||h.get('error_description')||p.get('error')||h.get('error')));history.replaceState(null,'',location.pathname);return;}if(p.has('code')){log('CALLBACK: Authorization code received');const r=await db.auth.exchangeCodeForSession(p.get('code'));history.replaceState(null,'',location.pathname);if(r.error)throw r.error;log('CALLBACK: Session exchange successful');}await inspect();});}catch(e){fail(e);}
</script></body></html>
