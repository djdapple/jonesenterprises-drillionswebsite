<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drillions / Admin</title><link rel="stylesheet" href="admin.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin.js"></script></head><body><header><strong>DRILLIONS / ADMIN</strong><button id="logout" hidden>Sign out</button></header><main><p id="status" role="status"></p><section id="login"><h1>Administrator login</h1><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="dashboard" hidden><h1>Product management</h1><div class="stats"><article>Products<strong id="count">0</strong></article><article>Stock units<strong id="units">0</strong></article><article>Retail inventory value<strong id="value">$0</strong></article></div><h2 id="formTitle">Add product</h2><form id="productForm"><div class="fields"><label>Name<input name="name" required></label><label>Category<input name="category" required></label><label>Price ($)<input name="price" type="number" min="0" step=".01" required></label><label>Sale price ($)<input name="sale_price" type="number" min="0" step=".01"></label><label>Stock<input name="stock" type="number" min="0" step="1" value="0" required></label><label>Image URL (optional)<input name="image_url" type="url"></label><label>Sizes (comma separated)<input name="sizes"></label><label>Colors (comma separated)<input name="colors"></label></div><section class="image-panel"><h3>Product photography</h3><label id="dropZone" class="drop-zone">Choose or drop a product photo<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG or WEBP · maximum 5 MB</small></label><img id="imagePreview" alt="Product image preview" hidden><p id="imageStatus" role="status"></p><button type="button" id="removeImage">Remove image from product</button><p class="image-note">The photo uploads when you save the product.</p></section><label>Description<textarea name="description"></textarea></label><label class="check"><input name="active" type="checkbox" checked> Active product</label><button>Save product</button> <button type="button" id="cancel">Clear form</button></form><h2>Catalog</h2><div id="catalog"></div></section></main></body></html>
